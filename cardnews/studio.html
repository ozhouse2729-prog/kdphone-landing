<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카드뉴스 스튜디오</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="cards.css" />
  <style>
    :root { --bg:#f4f5fb; --panel:#fff; --ink:#15161c; --ink-2:#4a4d5a; --line:#e6e7ee; --pri:#3b2bff; --bad:#e5384f; --good:#15a35b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard",sans-serif; letter-spacing:-0.02em; }
    .app { display:grid; grid-template-columns: 400px 1fr; min-height:100vh; }
    aside { background:var(--panel); border-right:1px solid var(--line); padding:24px; display:flex; flex-direction:column; gap:18px; }
    h1 { font-size:20px; margin:0; }
    h2 { font-size:14px; margin:0 0 8px; color:var(--ink-2); }
    .step { border:1px solid var(--line); border-radius:14px; padding:14px; }
    .step b.n { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--pri); color:#fff; font-size:12px; margin-right:6px; }
    textarea { width:100%; height:260px; font:12px/1.5 ui-monospace,Menlo,monospace; border:1px solid var(--line); border-radius:10px; padding:10px; resize:vertical; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    button, .btn { border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 14px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
    button.pri { background:var(--pri); color:#fff; border-color:var(--pri); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    label.file { display:block; font-size:13px; margin:6px 0; }
    label.file input { display:block; margin-top:4px; font-size:12px; }
    .slider { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2); }
    .slider input { flex:1; }
    .status { border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.6; }
    .status.ok { background:#e8f8ef; color:var(--good); }
    .status.bad { background:#fdecef; color:var(--bad); }
    .status ul { margin:6px 0 0; padding-left:18px; }
    main { padding:28px; overflow:auto; }
    .deck { display:flex; gap:20px; flex-wrap:wrap; }
    .frame { width:432px; height:540px; border-radius:6px; overflow:hidden; box-shadow:0 10px 30px rgba(28,25,90,.15); flex:none; }
    .frame .card { transform:scale(.4); transform-origin:0 0; }
    .hint { font-size:12px; color:var(--ink-2); line-height:1.6; margin:0; }
    .brief { font-size:13px; background:var(--bg); border-radius:10px; padding:10px; color:var(--ink-2); }
    @media (max-width: 900px) { .app { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <h1>카드뉴스 스튜디오</h1>

    <div class="step">
      <h2><b class="n">1</b>AI가 준 JSON 붙여넣기</h2>
      <textarea id="json" spellcheck="false" placeholder="PROMPT.md로 AI에게 받은 JSON을 그대로 붙여넣으세요"></textarea>
      <div class="row">
        <button class="pri" id="apply">적용 + 검사</button>
        <button id="loadSample">샘플 불러오기</button>
      </div>
    </div>

    <div class="step">
      <h2><b class="n">2</b>사진 넣기 (공식 보도자료 사진)</h2>
      <div class="brief" id="brief">사진 가이드가 여기에 표시됩니다.</div>
      <label class="file">1p 커버 사진 (필수)
        <input type="file" id="img1" accept="image/*" />
      </label>
      <div class="slider">좌우 <input type="range" id="fx" min="0" max="100" value="50" /></div>
      <div class="slider">상하 <input type="range" id="fy" min="0" max="100" value="40" /></div>
      <div class="slider">확대 <input type="range" id="fz" min="100" max="200" value="100" /></div>
      <label class="file">2p 배경 사진 (선택 · 없으면 커버 사진을 흐리게)
        <input type="file" id="img2" accept="image/*" />
      </label>
      <p class="hint">제품은 화면 위쪽 절반에 오게 맞추세요. 아래쪽 45%는 제목 자리입니다.</p>
    </div>

    <div class="step">
      <h2><b class="n">3</b>검사 통과 후 저장</h2>
      <div id="status" class="status bad">아직 적용 전입니다.</div>
      <div class="row">
        <button class="pri" id="export" disabled>PNG 3장 저장</button>
      </div>
      <p class="hint">규칙 위반이 하나라도 있으면 저장 버튼이 잠깁니다. 위반 목록을 복사해 AI에게 "수정 프롬프트"로 다시 보내세요.</p>
      <div class="row"><button id="copyFix">수정 프롬프트 복사</button></div>
    </div>
  </aside>

  <main>
    <div class="deck" id="deck"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="rules.js"></script>
<script src="sample.js"></script>
<script src="studio.js"></script>
</body>
</html>
